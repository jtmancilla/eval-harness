name: "causal_inference_benchmark"
description: "Pearl's Ladder of Causation evaluation under financial domain narratives"

model_configs:
  - name: "gpt-6-astra"
    protocol: "responses"
    reasoning_efforts: ["low", "medium", "high"]

# Modelo para generación sintética de narrativas (Fases 2-3, llamadas directas)
generator_model: "gpt-6-astra"
generator_reasoning_effort: "low"

dag_config:
  num_dags: 3334
  min_nodes: 4
  max_nodes: 8
  seed: 42
  templates:
    - confounding_fork
    - mediator_chain
    - collider
    - instrumental_variable
    - diamond
    - full_model

conditions:
  - "causal_inference"

entropy_level: 0
output_prefix: "causal_batch"
budget_ceiling_usd: 300.00
concurrency: 20
