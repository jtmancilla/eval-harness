name: "causal_live_5k_benchmark"
description: "Pearl's Ladder of Causation — 5,000 Live Generative Evaluation Cases"

model_configs:
  - name: "gpt-6-astra"
    protocol: "responses"
    reasoning_efforts: ["low", "medium", "high"]

generator_model: "gpt-6-astra"
generator_reasoning_effort: "low"

dag_config:
  num_dags: 1667
  min_nodes: 4
  max_nodes: 8
  seed: 42
  templates:
    - confounding_fork
    - mediator_chain
    - collider
    - instrumental_variable
    - diamond
    - full_model

conditions:
  - "causal_inference"

entropy_level: 0
output_prefix: "causal_live_5k_batch"
budget_ceiling_usd: 300.00
concurrency: 20
